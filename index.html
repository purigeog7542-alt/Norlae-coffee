<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบขาย (POS) - Nor Lae Bunker Coffee</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#09090b',
                        cardbg: '#18181b',
                        bordercol: '#27272a'
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #09090b; color: #f4f4f5; }
    </style>
    <link rel="icon" type="image/jpeg" href="IMG_2093.jpeg">
    <link rel="apple-touch-icon" href="IMG_2093.jpeg">
</head>
<body class="min-h-screen flex flex-col antialiased bg-darkbg text-zinc-100">

    <!-- NAVBAR -->
    <header class="border-b border-bordercol bg-cardbg/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-3 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="p-2 bg-zinc-800 text-white rounded-xl border border-bordercol">
                    <i class="fa-solid fa-mug-hot text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xs sm:text-sm text-zinc-100">Nor Lae Coffee</h1>
                    <p class="text-[9px] text-zinc-400">บก.ควบคุมผาดำ</p>
                </div>
            </div>

            <!-- Navigation Links -->
            <div class="flex items-center gap-1 bg-darkbg p-1 rounded-xl border border-bordercol text-xs">
                <a href="index.html" class="px-2.5 py-1.5 rounded-lg font-bold bg-zinc-800 text-white transition shadow">POS</a>
                <a href="dashboard.html" class="px-2.5 py-1.5 rounded-lg font-bold text-zinc-400 hover:text-white transition">สรุป</a>
                <a href="cost.html" class="px-2.5 py-1.5 rounded-lg font-bold text-zinc-400 hover:text-white transition">ต้นทุน</a>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-3 py-4 space-y-4">
        
        <!-- Dual Pricing Switcher & Search -->
        <div class="flex flex-col gap-2.5 bg-cardbg border border-bordercol rounded-2xl p-3 shadow-lg">
            <div class="flex items-center bg-darkbg p-1 rounded-xl border border-bordercol w-full justify-center">
                <button onclick="setCustomerType('soldier')" id="btn-soldier" class="flex-1 py-2 rounded-lg text-white bg-zinc-800 font-bold text-xs transition flex items-center justify-center gap-1">
                    <i class="fa-solid fa-shield-halved"></i> กำลังพล (สวัสดิการ)
                </button>
                <button onclick="setCustomerType('tourist')" id="btn-tourist" class="flex-1 py-2 rounded-lg text-zinc-400 hover:text-white font-bold text-xs transition flex items-center justify-center gap-1">
                    <i class="fa-solid fa-camera"></i> นักท่องเที่ยว (ปกติ)
                </button>
            </div>

            <div class="flex gap-2">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500 text-xs"></i>
                    <input type="text" id="search-product" onkeyup="renderProducts()" placeholder="ค้นหาเมนู..." class="w-full pl-8 pr-3 py-2 bg-darkbg rounded-xl border border-bordercol text-xs font-medium text-zinc-100 focus:outline-none focus:border-zinc-500">
                </div>
                <div class="flex gap-1">
                    <button onclick="filterCategory('all', event)" class="cat-btn px-3 py-2 rounded-xl font-bold bg-zinc-800 text-white text-xs whitespace-nowrap">ทั้งหมด</button>
                    <button onclick="filterCategory('hot-coffee', event)" class="cat-btn px-3 py-2 rounded-xl font-bold bg-darkbg text-zinc-400 border border-bordercol text-xs whitespace-nowrap">ร้อน</button>
                    <button onclick="filterCategory('iced-coffee', event)" class="cat-btn px-3 py-2 rounded-xl font-bold bg-darkbg text-zinc-400 border border-bordercol text-xs whitespace-nowrap">เย็น</button>
                </div>
            </div>
        </div>

        <!-- Layout Grid for Products, Cart & Active Bills -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
            
            <!-- Products Catalog -->
            <div class="lg:col-span-2 flex flex-col bg-cardbg border border-bordercol rounded-2xl p-3 sm:p-4 shadow-lg">
                <h3 class="font-bold text-xs sm:text-sm text-zinc-100 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-mug-saucer"></i> รายการเครื่องดื่ม
                </h3>
                <div id="pos-products-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    <!-- Rendered by JS -->
                </div>
            </div>

            <!-- Cart Section & Active Bills -->
            <div class="flex flex-col space-y-4">
                
                <!-- Cart -->
                <div class="flex flex-col bg-cardbg border border-bordercol rounded-2xl p-3 sm:p-4 shadow-lg">
                    <div class="flex items-center justify-between pb-2 border-b border-bordercol">
                        <h3 class="font-bold text-xs sm:text-sm text-zinc-100 flex items-center gap-2">
                            <i class="fa-solid fa-cart-shopping"></i> ตะกร้าปัจจุบัน
                        </h3>
                        <span id="cart-item-count" class="bg-zinc-800 text-zinc-200 font-bold text-xs px-2.5 py-0.5 rounded-full border border-bordercol">0 ชิ้น</span>
                    </div>

                    <div id="cart-items-list" class="flex-1 overflow-y-auto py-3 space-y-2 max-h-48">
                        <div class="h-24 flex flex-col items-center justify-center text-zinc-500 space-y-1">
                            <i class="fa-solid fa-basket-shopping text-xl"></i>
                            <p class="text-xs font-medium">ยังไม่มีรายการในตะกร้า</p>
                        </div>
                    </div>

                    <div class="pt-3 border-t border-bordercol space-y-2 text-xs">
                        <div class="flex justify-between text-zinc-400">
                            <span>รวมราคา</span>
                            <span id="cart-subtotal" class="font-bold text-zinc-100 font-mono">฿0.00</span>
                        </div>
                        <div class="flex gap-2 pt-1">
                            <button onclick="saveAsBill()" id="btn-save-bill" disabled class="flex-1 bg-zinc-800 hover:bg-zinc-700 disabled:opacity-50 text-white font-bold py-2.5 rounded-xl text-xs transition border border-bordercol flex items-center justify-center gap-1.5">
                                <i class="fa-solid fa-receipt"></i> เปิดบิลค้างไว้
                            </button>
                            <button onclick="openCheckoutModalDirect()" id="btn-checkout-direct" disabled class="flex-1 bg-zinc-100 hover:bg-white text-darkbg disabled:opacity-50 font-bold py-2.5 rounded-xl text-xs transition shadow flex items-center justify-center gap-1.5">
                                <i class="fa-solid fa-money-bill-wave"></i> ชำระเงินทันที
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Active Bills Queue -->
                <div class="flex flex-col bg-cardbg border border-bordercol rounded-2xl p-3 sm:p-4 shadow-lg">
                    <div class="flex items-center justify-between pb-2 border-b border-bordercol">
                        <h3 class="font-bold text-xs sm:text-sm text-zinc-100 flex items-center gap-2">
                            <i class="fa-solid fa-list-check"></i> บิลที่รอชำระ / ทำอยู่
                        </h3>
                        <span id="bill-count-badge" class="bg-amber-500/20 text-amber-400 border border-amber-500/30 font-bold text-[10px] px-2 py-0.5 rounded-full">0 บิล</span>
                    </div>
                    <div id="active-bills-list" class="space-y-2 py-2 max-h-48 overflow-y-auto">
                        <p class="text-xs text-zinc-500 text-center py-3">ยังไม่มีบิลค้างในระบบ</p>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <!-- CHECKOUT MODAL -->
    <div id="modal-checkout" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 hidden backdrop-blur-sm">
        <div class="bg-cardbg border border-bordercol rounded-3xl w-full max-w-md overflow-hidden shadow-2xl p-5 space-y-3">
            <div class="flex justify-between items-center border-b border-bordercol pb-2">
                <h3 class="font-bold text-base text-zinc-100">ชำระเงิน & บันทึกบิล</h3>
                <button onclick="closeCheckoutModal()" class="text-zinc-400 text-lg font-bold hover:text-white">&times;</button>
            </div>
            
            <div class="text-center bg-darkbg p-3 rounded-xl border border-bordercol">
                <p class="text-[11px] font-bold text-zinc-400">ยอดที่ต้องชำระสุทธิ</p>
                <h2 id="checkout-total-price" class="text-2xl font-black text-zinc-100 font-mono mt-0.5">฿0.00</h2>
            </div>

            <div>
                <label class="block font-bold text-zinc-300 text-[11px] mb-1">ชื่อกำลังพล / หมายเหตุบิล</label>
                <input type="text" id="order-note" placeholder="เช่น บิลโต๊ะ 1, สรุปสิ้นเดือน" class="w-full p-2.5 bg-darkbg border border-bordercol rounded-xl font-medium text-zinc-100 text-xs focus:outline-none focus:border-zinc-500">
            </div>

            <div class="space-y-1.5">
                <label class="block font-bold text-zinc-300 text-[11px]">รับเงินมา (บาท)</label>
                <input type="number" id="cash-received" oninput="calculateChange()" placeholder="0.00" class="w-full text-right text-xl font-mono font-bold p-2.5 bg-darkbg border border-bordercol rounded-xl text-zinc-100 focus:outline-none focus:border-zinc-500">
                
                <div class="flex justify-between items-center bg-darkbg p-2.5 rounded-xl border border-bordercol">
                    <span class="text-[11px] font-bold text-zinc-400">เงินทอน</span>
                    <span id="cash-change" class="text-lg font-mono font-black text-emerald-400">฿0.00</span>
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-1">
                <button onclick="closeCheckoutModal()" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-xl text-xs font-bold transition border border-bordercol">ยกเลิก</button>
                <button onclick="confirmPayment()" id="btn-confirm-pay" class="px-5 py-2 bg-zinc-100 hover:bg-white text-darkbg font-bold rounded-xl text-xs shadow-xl flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-check"></i> ยืนยันรับเงิน & บันทึก
                </button>
            </div>
        </div>
    </div>

    <script src="script.js?v=8"></script>
</body>
</html>
