<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบขาย (POS) - Nor Lae Bunker Coffee</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Prompt & Sarabun -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Prompt', 'Sarabun', sans-serif; background-color: #0f172a; color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.1); }
        ::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

    <!-- NAVBAR -->
    <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-amber-500/10 text-amber-500 rounded-lg border border-amber-500/20">
                    <i class="fa-solid fa-mug-hot text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base text-slate-100">Nor Lae Bunker Coffee</h1>
                    <p class="text-[11px] text-slate-400">บก.ควบคุมผาดำ • ระบบ POS</p>
                </div>
            </div>

            <!-- Navigation Links -->
            <div class="flex items-center gap-1 bg-slate-800 p-1 rounded-xl text-xs">
                <a href="index.html" class="px-4 py-2 rounded-lg font-bold bg-amber-500 text-slate-950 transition flex items-center gap-2 shadow">
                    <i class="fa-solid fa-cash-register"></i> ระบบขาย (POS)
                </a>
                <a href="dashboard.html" class="px-4 py-2 rounded-lg font-medium text-slate-300 hover:text-white transition flex items-center gap-2">
                    <i class="fa-solid fa-chart-pie"></i> แดชบอร์ด & ยอดขาย
                </a>
            </div>

            <div class="hidden sm:flex items-center gap-2">
                <span class="px-3 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full text-xs font-semibold flex items-center gap-1.5">
                    <span class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></span>
                    Supabase Connected
                </span>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 h-[calc(100vh-7rem)]">
            
            <!-- Left & Center: Products Catalog -->
            <div class="lg:col-span-2 flex flex-col bg-slate-900 border border-slate-800 rounded-2xl p-4 overflow-hidden shadow-xl">
                <div class="flex flex-col sm:flex-row items-center justify-between gap-3 mb-4">
                    <div class="relative w-full sm:w-64">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input type="text" id="search-product" onkeyup="renderProducts()" placeholder="ค้นหาเมนู..." class="w-full pl-9 pr-4 py-2 bg-slate-800 rounded-xl border border-slate-700 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>

                    <!-- Dual Pricing Switcher -->
                    <div class="flex items-center bg-slate-950 p-1 rounded-xl text-xs font-bold border border-slate-800 w-full sm:w-auto justify-center">
                        <button onclick="setCustomerType('soldier')" id="btn-soldier" class="px-3 py-1.5 rounded-lg text-slate-950 bg-amber-500 transition flex items-center gap-1.5">
                            <i class="fa-solid fa-shield-halved"></i> กำลังพล (สวัสดิการ)
                        </button>
                        <button onclick="setCustomerType('tourist')" id="btn-tourist" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition flex items-center gap-1.5">
                            <i class="fa-solid fa-camera"></i> นักท่องเที่ยว (ราคาปกติ)
                        </button>
                    </div>
                </div>

                <!-- Category Tabs -->
                <div class="flex space-x-2 overflow-x-auto pb-2 mb-3 text-xs scrollbar-none">
                    <button onclick="filterCategory('all')" class="cat-btn px-4 py-2 rounded-full font-medium bg-amber-500 text-slate-950 whitespace-nowrap shadow">ทั้งหมด</button>
                    <button onclick="filterCategory('hot-coffee')" class="cat-btn px-4 py-2 rounded-full font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap">กาแฟร้อน</button>
                    <button onclick="filterCategory('iced-coffee')" class="cat-btn px-4 py-2 rounded-full font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap">กาแฟเย็น</button>
                </div>

                <!-- Products Grid -->
                <div id="pos-products-grid" class="flex-1 overflow-y-auto pr-1 grid grid-cols-2 sm:grid-cols-3 gap-3">
                    <!-- Rendered by JS -->
                </div>
            </div>

            <!-- Right: Cart & Checkout -->
            <div class="flex flex-col bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl h-[calc(100vh-7rem)]">
                <div class="flex items-center justify-between pb-3 border-b border-slate-800">
                    <h2 class="font-bold text-sm text-slate-100 flex items-center gap-2">
                        <i class="fa-solid fa-cart-shopping text-amber-500"></i> ตะกร้าสินค้า
                    </h2>
                    <span id="cart-item-count" class="bg-amber-500/20 text-amber-400 font-bold text-xs px-2.5 py-0.5 rounded-full">0 ชิ้น</span>
                </div>

                <!-- Cart List -->
                <div id="cart-items-list" class="flex-1 overflow-y-auto py-3 space-y-2">
                    <div class="h-full flex flex-col items-center justify-center text-slate-500 space-y-2">
                        <i class="fa-solid fa-basket-shopping text-3xl"></i>
                        <p class="text-xs">ยังไม่มีรายการในตะกร้า</p>
                    </div>
                </div>

                <!-- Cart Summary & Checkout -->
                <div class="pt-3 border-t border-slate-800 space-y-2 text-xs">
                    <div class="flex justify-between text-slate-400">
                        <span>รวมราคาเครื่องดื่ม</span>
                        <span id="cart-subtotal" class="font-medium text-slate-200">฿0.00</span>
                    </div>
                    <div class="flex justify-between text-base font-bold text-slate-100 pt-1 border-t border-slate-800">
                        <span>ยอดชำระสุทธิ</span>
                        <span id="cart-total" class="text-amber-400 text-lg font-mono">฿0.00</span>
                    </div>
                    <button onclick="openCheckoutModal()" id="btn-checkout" disabled class="w-full mt-2 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-800 disabled:text-slate-600 disabled:cursor-not-allowed text-slate-950 font-bold py-3 rounded-xl transition shadow-lg flex items-center justify-center gap-2">
                        <i class="fa-solid fa-money-bill-wave"></i> ชำระเงิน
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- CHECKOUT MODAL -->
    <div id="modal-checkout" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 hidden backdrop-blur-sm">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md overflow-hidden shadow-2xl p-6 space-y-5">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-base text-slate-100">ชำระเงิน & บันทึก Supabase</h3>
                <button onclick="closeCheckoutModal()" class="text-slate-400 hover:text-white text-xl">&times;</button>
            </div>
            
            <div class="text-center bg-slate-950 p-4 rounded-2xl border border-slate-800">
                <p class="text-xs text-slate-400">ยอดที่ต้องชำระสุทธิ</p>
                <h2 id="checkout-total-price" class="text-3xl font-extrabold text-amber-400 font-mono mt-1">฿0.00</h2>
            </div>

            <div class="space-y-3">
                <label class="block font-medium text-slate-300 text-xs">รับเงินมา (บาท)</label>
                <input type="number" id="cash-received" oninput="calculateChange()" placeholder="0.00" class="w-full text-right text-2xl font-mono font-bold p-3 bg-slate-800 border border-slate-700 rounded-xl text-slate-100 focus:outline-none focus:ring-2 focus:ring-amber-500">
                
                <div class="flex justify-between items-center bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <span class="text-xs text-slate-400">เงินทอน</span>
                    <span id="cash-change" class="text-xl font-mono font-bold text-emerald-400">฿0.00</span>
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeCheckoutModal()" class="px-4 py-2 text-slate-400 hover:text-white rounded-xl text-xs font-medium">ยกเลิก</button>
                <button onclick="completePaymentAndSave()" id="btn-confirm-pay" class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold rounded-xl text-xs shadow-lg flex items-center gap-2">
                    <i class="fa-solid fa-check"></i> ยืนยัน & บันทึกลง Supabase
                </button>
            </div>
        </div>
    </div>

    <!-- Script File -->
    <script src="script.js"></script>
</body>
</html>
