<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แดชบอร์ด & ยอดขาย - Nor Lae Bunker Coffee</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Prompt & Sarabun -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Prompt', 'Sarabun', sans-serif; background-color: #0f172a; color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.1); }
        ::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

    <!-- NAVBAR -->
    <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-amber-500/10 text-amber-500 rounded-lg border border-amber-500/20">
                    <i class="fa-solid fa-mug-hot text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base text-slate-100">Nor Lae Bunker Coffee</h1>
                    <p class="text-[11px] text-slate-400">บก.ควบคุมผาดำ • แดชบอร์ด & รายงาน</p>
                </div>
            </div>

            <!-- Navigation Links -->
            <div class="flex items-center gap-1 bg-slate-800 p-1 rounded-xl text-xs">
                <a href="index.html" class="px-4 py-2 rounded-lg font-medium text-slate-300 hover:text-white transition flex items-center gap-2">
                    <i class="fa-solid fa-cash-register"></i> ระบบขาย (POS)
                </a>
                <a href="dashboard.html" class="px-4 py-2 rounded-lg font-bold bg-amber-500 text-slate-950 transition flex items-center gap-2 shadow">
                    <i class="fa-solid fa-chart-pie"></i> แดชบอร์ด & ยอดขาย
                </a>
            </div>

            <div class="hidden sm:flex items-center gap-2">
                <span class="px-3 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full text-xs font-semibold flex items-center gap-1.5">
                    <span class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></span>
                    Supabase Connected
                </span>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                <span class="text-xs text-slate-400">ยอดขายรวมทั้งหมด</span>
                <div id="stats-total-revenue" class="text-2xl font-bold text-amber-400 mt-1">฿0.00</div>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                <span class="text-xs text-slate-400">จำนวนแก้วที่ขายได้</span>
                <div id="stats-total-cups" class="text-2xl font-bold text-emerald-400 mt-1">0 แก้ว</div>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                <span class="text-xs text-slate-400">จำนวนออเดอร์ทั้งหมด</span>
                <div id="stats-total-orders" class="text-2xl font-bold text-sky-400 mt-1">0 รายการ</div>
            </div>
        </div>

        <!-- Sales History Table -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-base font-bold text-slate-100">ประวัติการขายล่าสุด (จาก Supabase)</h2>
                <button onclick="loadSalesHistory()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-rotate"></i> โหลดข้อมูลใหม่
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-xs text-left text-slate-300">
                    <thead class="bg-slate-800/60 text-slate-400 uppercase">
                        <tr>
                            <th class="px-4 py-3 rounded-l-lg">เวลา</th>
                            <th class="px-4 py-3">ประเภทลูกค้า</th>
                            <th class="px-4 py-3">รายการสินค้า</th>
                            <th class="px-4 py-3 text-right">จำนวน</th>
                            <th class="px-4 py-3 text-right rounded-r-lg">ยอดรวม (บาท)</th>
                        </tr>
                    </thead>
                    <tbody id="sales-history-body" class="divide-y divide-slate-800">
                        <tr>
                            <td colspan="5" class="text-center py-6 text-slate-500">กำลังโหลดข้อมูล...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Script File -->
    <script src="script.js"></script>
</body>
</html>
