<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คำนวณต้นทุน - Nor Lae Bunker Coffee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; color: #0f172a; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased bg-white text-black">

    <!-- NAVBAR -->
    <header class="border-b-2 border-black bg-white sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-3 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="p-2 bg-black text-white rounded-xl">
                    <i class="fa-solid fa-mug-hot text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xs sm:text-sm text-black">Nor Lae Coffee</h1>
                    <p class="text-[9px] text-gray-600">คำนวณต้นทุน</p>
                </div>
            </div>

            <div class="flex items-center gap-1 bg-gray-100 p-1 rounded-xl border-2 border-black text-xs">
                <a href="index.html" class="px-2.5 py-1.5 rounded-lg font-bold text-black hover:bg-gray-200 transition">POS</a>
                <a href="dashboard.html" class="px-2.5 py-1.5 rounded-lg font-bold text-black hover:bg-gray-200 transition">สรุป</a>
                <a href="cost.html" class="px-2.5 py-1.5 rounded-lg font-bold bg-black text-white transition shadow">ต้นทุน</a>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-3 py-4 space-y-4">
        
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            
            <!-- INPUT FORM -->
            <div class="bg-white border-2 border-black rounded-2xl p-4 sm:p-6 shadow-lg space-y-4">
                <h2 class="text-base font-bold text-black border-b-2 border-black pb-2 flex items-center gap-2">
                    <i class="fa-solid fa-sliders"></i> กำหนดราคาวัตถุดิบ (ต่อหน่วย)
                </h2>

                <div class="space-y-3 text-xs sm:text-sm font-medium">
                    <div>
                        <label class="block font-bold text-black mb-1">ราคาเมล็ดกาแฟ (บาท / กรัม)</label>
                        <input type="number" id="cost-bean-per-gram" value="0.75" step="0.01" oninput="calculateCosts()" class="w-full p-2.5 bg-gray-50 border-2 border-black rounded-xl font-mono text-sm font-bold focus:outline-none">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block font-bold text-black mb-1">แก้วร้อน (บาท/ใบ)</label>
                            <input type="number" id="cost-hot-cup" value="1.50" step="0.25" oninput="calculateCosts()" class="w-full p-2.5 bg-gray-50 border-2 border-black rounded-xl font-mono text-sm font-bold">
                        </div>
                        <div>
                            <label class="block font-bold text-black mb-1">ฝาร้อน (บาท/ชิ้น)</label>
                            <input type="number" id="cost-hot-lid" value="0.80" step="0.10" oninput="calculateCosts()" class="w-full p-2.5 bg-gray-50 border-2 border-black rounded-xl font-mono text-sm font-bold">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block font-bold text-black mb-1">แก้วเย็น (บาท/ใบ)</label>
                            <input type="number" id="cost-iced-cup" value="2.00" step="0.25" oninput="calculateCosts()" class="w-full p-2.5 bg-gray-50 border-2 border-black rounded-xl font-mono text-sm font-bold">
                        </div>
                        <div>
                            <label class="block font-bold text-black mb-1">ฝาเย็น (บาท/ชิ้น)</label>
                            <input type="number" id="cost-iced-lid" value="0.80" step="0.10" oninput="calculateCosts()" class="w-full p-2.5 bg-gray-50 border-2 border-black rounded-xl font-mono text-sm font-bold">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block font-bold text-black mb-1">หลอด (บาท/เส้น)</label>
                            <input type="number" id="cost-straw" value="0.25" step="0.05" oninput="calculateCosts()" class="w-full p-2.5 bg-gray-50 border-2 border-black rounded-xl font-mono text-sm font-bold">
                        </div>
                        <div>
                            <label class="block font-bold text-black mb-1">น้ำแข็ง (กระสอบใหญ่)</label>
                            <input type="number" id="cost-ice-bag" value="50.00" step="5.00" oninput="calculateCosts()" class="w-full p-2.5 bg-gray-50 border-2 border-black rounded-xl font-mono text-sm font-bold">
                        </div>
                    </div>

                    <div>
                        <label class="block font-bold text-black mb-1">ยอดลงทุนอุปกรณ์รวม (CapEx ตั้งต้น)</label>
                        <input type="number" id="total-capex" value="13846" step="100" oninput="calculateCosts()" class="w-full p-2.5 bg-gray-50 border-2 border-black rounded-xl font-mono text-sm font-bold">
                    </div>
                </div>
            </div>

            <!-- RESULTS -->
            <div class="space-y-4">
                
                <div class="bg-white border-2 border-black rounded-2xl p-4 sm:p-6 shadow-lg space-y-3">
                    <h2 class="text-base font-bold text-black border-b-2 border-black pb-2 flex items-center gap-2">
                        <i class="fa-solid fa-receipt"></i> ต้นทุนต่อแก้ว (COGS)
                    </h2>
                    
                    <div class="space-y-2 text-xs sm:text-sm">
                        <div class="flex justify-between items-center p-3 bg-gray-50 rounded-xl border-2 border-black">
                            <span class="font-bold">☕ อเมริกาโน่ร้อน (18g)</span>
                            <span id="result-hot-cogs" class="font-mono text-base sm:text-lg font-black">฿0.00</span>
                        </div>
                        <div class="flex justify-between items-center p-3 bg-gray-50 rounded-xl border-2 border-black">
                            <span class="font-bold">🧊 อเมริกาโน่เย็น (20g + น้ำแข็ง)</span>
                            <span id="result-iced-cogs" class="font-mono text-base sm:text-lg font-black">฿0.00</span>
                        </div>
                    </div>
                </div>

                <div class="bg-white border-2 border-black rounded-2xl p-4 sm:p-6 shadow-lg space-y-3">
                    <h2 class="text-base font-bold text-black border-b-2 border-black pb-2 flex items-center gap-2">
                        <i class="fa-solid fa-bullseye"></i> วิเคราะห์จุดคุ้มทุน
                    </h2>
                    
                    <div class="space-y-2 text-xs sm:text-sm">
                        <div class="flex justify-between items-center p-3 bg-gray-50 rounded-xl border-2 border-black">
                            <span class="font-bold">กำไรเฉลี่ยต่อแก้ว</span>
                            <span id="result-avg-profit" class="font-mono text-base sm:text-lg font-black">฿0.00</span>
                        </div>
                        <div class="flex justify-between items-center p-3 bg-black text-white rounded-xl border-2 border-black shadow">
                            <span class="font-bold text-xs sm:text-sm">เป้าหมายแก้วคืนทุนทั้งหมด</span>
                            <span id="result-break-even-cups" class="font-mono text-lg sm:text-xl font-black text-white">0 แก้ว</span>
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </main>

        <script src="script.js?v=5"></script>
    <script>
        // บังคับให้คำนวณทันทีเมื่อเปิดหน้าต้นทุน
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof calculateCosts === 'function') {
                calculateCosts();
            }
        });
    </script>
</body>
</html>
